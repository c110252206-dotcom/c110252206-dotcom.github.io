<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血壓監測系統</title>
</head>
<body>

    <h2>血壓量測辨識</h2>
    <p>請上傳照片自動辨識，或手動輸入數據後存入雲端表格。</p>

    <div style="margin-bottom: 20px;">
        <input type="file" id="photoInput" accept="image/*" onchange="previewImage()">
        <br><br>
        <img id="bp-preview" style="max-width: 300px; display: none; border-radius: 8px; border: 1px solid #ccc;">
    </div>

    <button id="recognizeBtn" onclick="uploadImage()" style="display: none; padding: 10px 20px;">開始辨識</button>
    <div id="bp-result" style="margin: 15px 0; font-weight: bold; color: blue;"></div>

    <hr>

    <div style="display: flex; flex-direction: column; gap: 10px; max-width: 300px;">
        <label>收縮壓 (SYS): <input id="sys" type="number"></label>
        <label>舒張壓 (DIA): <input id="dia" type="number"></label>
        <label>心跳 (Pulse): <input id="pulse" type="number"></label>
        <button onclick="submitData()" style="padding: 10px; background-color: #008cba; color: white; border: none; cursor: pointer;">送出資料</button>
    </div>

    <p id="msg" style="margin-top: 15px; font-weight: bold;"></p>

    <script>
        // 配置網址
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJSE14O11QZdDTr7vfGCIjIm0jLcc0pzDjyEMbHt9Y7DcXmRlA_j-fcqfDVSICcmDODQ/exec";
        const NETLIFY_API = " https://lambent-kulfi-f23dd4.netlify.app/.netlify/functions/recognize";

        // 1. 預覽照片
        function previewImage() {
            const file = document.getElementById('photoInput').files[0];
            const preview = document.getElementById('bp-preview');
            const btn = document.getElementById('recognizeBtn');
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    btn.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // 2. 辨識照片 (AI 辨識)
        async function uploadImage() {
            const file = document.getElementById('photoInput').files[0];
            const resultDiv = document.getElementById('bp-result');
            if (!file) return;

            resultDiv.innerText = "⏳ 辨識中...";
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = async () => {
                const base64Data = reader.result.split(',')[1];
                try {
                    const response = await fetch(NETLIFY_API, {
                        method: 'POST',
                        body: JSON.stringify({ image: base64Data, mimeType: file.type })
                    });
                    const data = await response.json();
                    resultDiv.innerText = "辨識結果：" + data.text;
                    
                    // 自動填入數值 (假設格式如 "120/80")
                    if (data.text.includes('/')) {
                        const parts = data.text.split('/');
                        document.getElementById("sys").value = parts[0].replace(/[^0-9]/g, '');
                        document.getElementById("dia").value = parts[1].replace(/[^0-9]/g, '');
                    }
                } catch (error) { 
                    resultDiv.innerText = "❌ 辨識失敗，請手動輸入。"; 
                }
            };
        }

        // 3. 送出數據 (修正 SyntaxError 問題)
        async function submitData() {
            const msg = document.getElementById("msg");
            const sys = document.getElementById("sys").value;
            const dia = document.getElementById("dia").value;
            const pulse = document.getElementById("pulse").value;

            if (!sys || !dia) return alert("請填寫收縮壓與舒張壓");

            msg.style.color = "blue";
            msg.innerText = "⏳ 資料上傳中...";

            // 使用 URLSearchParams 以傳統表單格式發送，這對 GAS 比較穩定
            const payload = new URLSearchParams({
                sys: sys,
                dia: dia,
                pulse: pulse
            });

            try {
                // 使用 mode: 'no-cors' 可以避開 SyntaxError，但無法讀取回傳結果
                // 如果你要看結果，GAS 必須正確設定 CORS。
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({sys, dia, pulse}), // 保持你原本的 JSON 格式
                });

                // 檢查回應是否為空
                const text = await response.text();
                if (!text) throw new Error("伺服器回傳空內容");

                const result = JSON.parse(text);

                if (result.result === "ok") {
                    msg.style.color = "black";
                    msg.innerText = "成功存入！結果：" + (result.status || "完成");
                    clearForm();
                } else {
                    throw new Error(result.message);
                }

            } catch (error) {
                // 當發生 SyntaxError 或 CORS 阻擋時，通常資料其實已經進試算表了
                msg.style.color = "orange";
                msg.innerText = "⚠️ 資料已嘗試送出。若試算表有新增內容則忽略此錯：" + error.message;
                console.error("提交錯誤:", error);
            }
        }

        function clearForm() {
            document.getElementById("sys").value = "";
            document.getElementById("dia").value = "";
            document.getElementById("pulse").value = "";
        }
    </script>
</body>
</html>
