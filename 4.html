<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鄧崴澤的自我介紹與登山紀錄</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(to right, #e3f2fd, #fff);
      color: #333;
    }

    header {
      background-color: #1565c0;
      color: white;
      text-align: center;
      padding: 20px 0;
    }

    header h1 {
      margin: 0;
      font-size: 2.5em;
    }

    .container {
      width: 90%;
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .intro {
      margin-bottom: 30px;
      padding: 20px;
      border-radius: 10px;
      background-color: #f5f5f5;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.1);
    }

    .intro h2 {
      margin-top: 0;
    }

    #gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-bottom: 50px;
    }

    #gallery img {
      width: 200px;
      border-radius: 10px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }

    #gallery img:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <header>
    <h1>鄧崴澤的自我介紹與登山紀錄</h1>
  </header>

  <div class="container">
    <div class="intro">
      <h2>自我介紹</h2>
      <p>
        我從兩歲時開始爬山，國中畢業那年登上第一座百岳——池有山，<br>
        目前已經完成92座百岳，擁有山域搜救證（南搜、高雄市山搜義消）、雪訓。<br>
        計畫未來可以挑戰中央山脈大縱走，以及海外攀登世界8000米高峰。
      </p>
    </div>

    <div id="gallery"></div>
  </div>

  <script>
    const folderPath = 'images/';   // 照片資料夾
    const totalImages = 92;         // 總共 92 張
    const galleryDiv = document.getElementById('gallery');

    for (let i = 1; i <= totalImages; i++) {
      const img = document.createElement('img');
      img.src = folderPath + 'photo (' + i + ').jpg';  // 檔名格式：photo (1).jpg
      img.alt = '登山照 ' + i;
      galleryDiv.appendChild(img);
    }
  </script>

</body>
</html>
